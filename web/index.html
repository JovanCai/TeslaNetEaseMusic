<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeslaNetEaseMusic</title>
    <script>
      // 启动即应用主题,避免刷新闪烁。auto = 按本地时间解析(与 src/ui/themes.ts 的 DAY_START/DAY_END 保持一致)
      try {
        var pref = localStorage.getItem('tm.theme') || 'neon';
        var t = pref;
        if (pref === 'auto') {
          var h = new Date().getHours();
          t = (h >= 6 && h < 18) ? 'daylight' : (localStorage.getItem('tm.darktheme') || 'neon');
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
