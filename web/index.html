<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeslaNetEaseMusic</title>
    <script>
      // 启动即应用主题,避免刷新闪烁。auto = 优先用缓存的当日日出日落判断昼夜,取不到回退固定窗口(6–18 点)。
      // 逻辑须与 src/ui/themes.ts 的 isDaytime 保持一致。
      try {
        var pref = localStorage.getItem('tm.theme') || 'neon';
        var t = pref;
        if (pref === 'auto') {
          var n = new Date();
          var ld = n.getFullYear() + '-' + (n.getMonth() + 1) + '-' + n.getDate();
          var isDay;
          try {
            var st = JSON.parse(localStorage.getItem('tm.suntimes') || 'null');
            if (st && st.d === ld) isDay = (Date.now() >= st.rise && Date.now() < st.set);
          } catch (e) {}
          if (isDay === undefined) { var h = n.getHours(); isDay = (h >= 6 && h < 18); }
          t = isDay ? 'daylight' : (localStorage.getItem('tm.darktheme') || 'neon');
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
