name: build-image

# 每次 push 到 main(或打 v* 标签)自动构建镜像并推到 GHCR,
# 这样部署端(群晖/VPS)只需 pull 现成镜像,无需本地编译。
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:      # 纯文档改动不触发镜像构建
      - '**.md'
      - 'docs/**'
  pull_request:        # PR 只跑测试,不推镜像
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  # 每周一自动重建一次:即使代码没变,也能用上 Node / Alpine 基础镜像的最新安全补丁
  schedule:
    - cron: '0 3 * * 1'

# 默认只读;推镜像的写权限只给 build 任务
permissions:
  contents: read

jobs:
  # 先跑前后端测试 + 类型检查,全部通过才构建/推送镜像,避免坏版本被 update.sh 拉到车上
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Server tests
        working-directory: server
        run: npm ci && npm test

      # 会进镜像的生产依赖出现高危/严重漏洞时直接失败(每周定时构建也会跑,能及时发现新披露的漏洞)
      - name: Audit production dependencies
        run: |
          (cd server && npm audit --omit=dev --audit-level=high)
          (cd web && npm audit --omit=dev --audit-level=high)

      - name: Web tests, lint & build
        working-directory: web
        run: npm ci && npm test && npm run lint && npm run build

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jovancai/teslaneteasemusic
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 总是拉取最新的 node:24-alpine;每周定时构建时不用缓存,连同 npm 依赖层一起刷新
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
