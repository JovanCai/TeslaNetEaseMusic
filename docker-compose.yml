services:
  ncm-api:
    # 固定版本 + digest:这个第三方镜像拿着你的网易云登录态,不跟 latest 自动升级,
    # 防止上游被篡改或出现不兼容改动。升级时到 Docker Hub 查新版本,确认无误后再改这里。
    image: moefurina/ncm-api:4.41.1@sha256:2fcf4dc49313109a91f6cec99c6b36ebd17e8f1fdc89686121dfd14525937896
    environment:
      # 灰歌解锁(从 QQ/酷狗/酷我/咪咕等找同名歌替换)。默认关;.env 设 ENABLE_UNBLOCK=true 开启。
      - ENABLE_GENERAL_UNBLOCK=${ENABLE_UNBLOCK:-false}
    restart: unless-stopped
  app:
    # 部署端可直接 pull GitHub Actions 预构建的镜像(无需本地编译);
    # 本地开发用 docker compose up --build 会按 build 重新构建并覆盖此 tag。
    image: ghcr.io/jovancai/teslaneteasemusic:latest
    build:
      context: .
    depends_on: [ncm-api]
    ports: ["${APP_PORT:-80}:80"]        # 端口被占用可在 .env 设 APP_PORT=8080 等
    environment:
      - NCM_BASE=http://ncm-api:3000
      - NCM_MUSIC_U=${NCM_MUSIC_U}
      - COOKIE_PATH=/data/cookie
      # 区域解锁:开启后后端自动注入随机中国 IP(realIP),解掉海外变灰的有版权歌
      - REGION_UNLOCK=${REGION_UNLOCK:-false}
      # 访问密码:设置后需输密码才能用(cookie 长期记住)。留空则不需要。
      - APP_PASSWORD=${APP_PASSWORD:-}
    volumes:
      - cookie-data:/data
      # 车机上传的诊断日志直接落在宿主机项目目录下的 diagnostics/(群晖 File Station 可见)
      - ./diagnostics:/diagnostics
    restart: unless-stopped

  # 可选一:固定地址的 Cloudflare 隧道(需要一个加到 Cloudflare 的域名)。
  # 在 .env 填 CLOUDFLARE_TUNNEL_TOKEN 后:docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [app]
    restart: unless-stopped

  # 可选二:免域名的快速隧道(给一个临时 https 地址,重启才会变)。
  # 启动:docker compose --profile quick up -d
  # 拿地址:docker compose logs cloudflared-quick | grep trycloudflare
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    profiles: ["quick"]
    command: tunnel --no-autoupdate --url http://app:80
    depends_on: [app]
    restart: unless-stopped

volumes:
  cookie-data:
